name: Refresh profile dashboard

on:
  workflow_dispatch:
  schedule:
    - cron: "17 6 * * *"
  push:
    branches:
      - main
    paths:
      - ".github/workflows/profile-dashboard.yml"

concurrency:
  group: profile-dashboard
  cancel-in-progress: true

jobs:
  generate:
    name: Generate live profile assets
    runs-on: ubuntu-latest
    timeout-minutes: 12
    permissions:
      contents: read

    steps:
      - name: Prepare output directory
        run: mkdir -p assets/generated

      - name: Generate GitHub stats
        uses: stats-organization/github-readme-stats-action@2c498845f71017821efaad14293ebc736156ef21 # v2
        with:
          card: stats
          options: username=${{ github.repository_owner }}&show_icons=true&include_all_commits=true&rank_icon=github&hide_border=true&bg_color=0D1117&title_color=D4AF37&icon_color=F2D57E&text_color=C9D1D9&locale=es
          path: assets/generated/github-stats.svg
          token: ${{ secrets.GITHUB_TOKEN }}
          fail_on_error: true

      - name: Generate language analytics
        uses: stats-organization/github-readme-stats-action@2c498845f71017821efaad14293ebc736156ef21 # v2
        with:
          card: top-langs
          options: username=${{ github.repository_owner }}&layout=compact&langs_count=8&card_width=495&hide_border=true&bg_color=0D1117&title_color=D4AF37&text_color=C9D1D9&locale=es
          path: assets/generated/top-languages.svg
          token: ${{ secrets.GITHUB_TOKEN }}
          fail_on_error: true

      - name: Generate contribution streak
        uses: DenverCoder1/github-readme-streak-stats@d855de1a23fe45bdda5ffbc28a6d4b80b0f107e1 # v1
        with:
          options: user=${{ github.repository_owner }}&hide_border=true&background=0D1117&ring=D4AF37&fire=F2D57E&currStreakLabel=D4AF37&sideLabels=C9D1D9&currStreakNum=E6EDF3&sideNums=E6EDF3&dates=8B949E&locale=es
          path: assets/generated/contribution-streak.svg
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate contribution snake
        uses: Platane/snk/svg-only@d8f6715049803e982ee5ff501b6b9b7d5deeb09b # v3
        with:
          github_user_name: ${{ github.repository_owner }}
          github_token: ${{ secrets.GITHUB_TOKEN }}
          outputs: |
            assets/generated/contribution-snake.svg?palette=github-light&color_snake=%23D4AF37&color_dots=%23ebedf0,%23f4e5a9,%23e5c158,%23b98a1d,%237d5c12
            assets/generated/contribution-snake-dark.svg?palette=github-dark&color_snake=%23F2D57E&color_dots=%23161b22,%233d2d0d,%236b4f14,%23a97c1a,%23d4af37

      - name: Upload generated profile assets
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: profile-dashboard-assets
          path: assets/generated
          if-no-files-found: error
          retention-days: 1

  publish:
    name: Publish refreshed assets
    needs: generate
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      actions: read
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Download generated profile assets
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: profile-dashboard-assets
          path: assets/generated

      - name: Commit refreshed assets
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/generated/*.svg
          if git diff --cached --quiet; then
            echo "Profile assets are already current."
            exit 0
          fi
          git commit -m "chore(profile): refresh live dashboard [skip ci]"
          git fetch origin main
          git rebase origin/main
          git push

