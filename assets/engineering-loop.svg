<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="230" viewBox="0 0 1200 230" role="img" aria-labelledby="title desc">
  <title id="title">Ciclo de ingeniería de Alejandro</title>
  <desc id="desc">Flujo animado desde una idea hasta el impacto, pasando por arquitectura y código.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#080b10" /><stop offset="1" stop-color="#111720" /></linearGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#8f6411" /><stop offset="0.5" stop-color="#f2d57e" /><stop offset="1" stop-color="#d4af37" /></linearGradient>
    <filter id="glow" x="-70%" y="-70%" width="240%" height="240%"><feGaussianBlur stdDeviation="4" result="blur" /><feMerge><feMergeNode in="blur" /><feMergeNode in="SourceGraphic" /></feMerge></filter>
    <pattern id="dots" width="16" height="16" patternUnits="userSpaceOnUse"><circle cx="1" cy="1" r="0.7" fill="#d4af37" opacity="0.09" /></pattern>
    <clipPath id="frame"><rect width="1200" height="230" rx="20" /></clipPath>
  </defs>
  <style>
    @keyframes flow { to { stroke-dashoffset:-108 } }
    @keyframes travel { 0% { transform:translateX(0); opacity:0 } 8%,92% { opacity:1 } 100% { transform:translateX(732px); opacity:0 } }
    @keyframes pulse { 0%,100% { opacity:.4 } 50% { opacity:1 } }
    .flow { animation:flow 3s linear infinite }
    .traveler { animation:travel 4s ease-in-out infinite }
    .pulse-1 { animation:pulse 4s 0s ease-in-out infinite }
    .pulse-2 { animation:pulse 4s 1s ease-in-out infinite }
    .pulse-3 { animation:pulse 4s 2s ease-in-out infinite }
    .pulse-4 { animation:pulse 4s 3s ease-in-out infinite }
    @media (prefers-reduced-motion: reduce) { .flow,.traveler,.pulse-1,.pulse-2,.pulse-3,.pulse-4 { animation:none !important } }
  </style>

  <g clip-path="url(#frame)">
    <rect width="1200" height="230" fill="url(#bg)" />
    <rect width="1200" height="230" fill="url(#dots)" />
    <text x="600" y="38" text-anchor="middle" fill="#d4af37" font-family="Segoe UI, Arial, sans-serif" font-size="14" font-weight="700" letter-spacing="5">MI CICLO DE INGENIERÍA</text>
    <path d="M162 128H894" fill="none" stroke="#30363d" stroke-width="3" />
    <path class="flow" d="M162 128H894" fill="none" stroke="url(#gold)" stroke-width="2" stroke-dasharray="12 15" />

    <g font-family="Segoe UI, Arial, sans-serif" text-anchor="middle">
      <g><rect x="72" y="86" width="180" height="84" rx="16" fill="#0d1117" stroke="#d4af37" stroke-opacity="0.55" /><circle class="pulse-1" cx="162" cy="86" r="6" fill="#d4af37" filter="url(#glow)" /><text x="162" y="121" fill="#f2d57e" font-size="24">✦</text><text x="162" y="151" fill="#e6edf3" font-size="13" font-weight="700" letter-spacing="2">IDEA</text></g>
      <g><rect x="316" y="86" width="180" height="84" rx="16" fill="#0d1117" stroke="#d4af37" stroke-opacity="0.55" /><circle class="pulse-2" cx="406" cy="86" r="6" fill="#d4af37" filter="url(#glow)" /><text x="406" y="122" fill="#f2d57e" font-size="22">◇</text><text x="406" y="151" fill="#e6edf3" font-size="13" font-weight="700" letter-spacing="2">ARQUITECTURA</text></g>
      <g><rect x="560" y="86" width="180" height="84" rx="16" fill="#0d1117" stroke="#d4af37" stroke-opacity="0.55" /><circle class="pulse-3" cx="650" cy="86" r="6" fill="#d4af37" filter="url(#glow)" /><text x="650" y="121" fill="#f2d57e" font-family="Consolas, monospace" font-size="20">&lt;/&gt;</text><text x="650" y="151" fill="#e6edf3" font-size="13" font-weight="700" letter-spacing="2">CÓDIGO</text></g>
      <g><rect x="804" y="86" width="180" height="84" rx="16" fill="#0d1117" stroke="#d4af37" stroke-opacity="0.55" /><circle class="pulse-4" cx="894" cy="86" r="6" fill="#d4af37" filter="url(#glow)" /><text x="894" y="122" fill="#f2d57e" font-size="22">↗</text><text x="894" y="151" fill="#e6edf3" font-size="13" font-weight="700" letter-spacing="2">IMPACTO</text></g>
    </g>

    <circle class="traveler" cx="162" cy="128" r="6" fill="#fff1a8" filter="url(#glow)" />
    <text x="600" y="205" text-anchor="middle" fill="#8b949e" font-family="Consolas, monospace" font-size="12" letter-spacing="2">OBSERVAR → DISEÑAR → CONSTRUIR → MEDIR → MEJORAR →</text>
  </g>
  <rect x="1" y="1" width="1198" height="228" rx="19" fill="none" stroke="#d4af37" stroke-opacity="0.25" stroke-width="2" />
</svg>

