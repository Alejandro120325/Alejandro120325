<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="360" viewBox="0 0 1200 360" role="img" aria-labelledby="title desc">
  <title id="title">Alejandro Ojeda — Software Engineering</title>
  <desc id="desc">Banner profesional en tonos negro y dorado para el perfil de GitHub de Alejandro Ojeda.</desc>

  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#05070b"/>
      <stop offset="0.5" stop-color="#0d1117"/>
      <stop offset="1" stop-color="#161b22"/>
    </linearGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#9f7414"/>
      <stop offset="0.28" stop-color="#f6d365"/>
      <stop offset="0.52" stop-color="#fff1a8"/>
      <stop offset="0.76" stop-color="#d4af37"/>
      <stop offset="1" stop-color="#8f6411"/>
    </linearGradient>
    <radialGradient id="halo" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#d4af37" stop-opacity="0.22"/>
      <stop offset="1" stop-color="#d4af37" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="42" height="42" patternUnits="userSpaceOnUse">
      <path d="M 42 0 L 0 0 0 42" fill="none" stroke="#d4af37" stroke-opacity="0.055" stroke-width="1"/>
    </pattern>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="5" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <clipPath id="frame">
      <rect width="1200" height="360" rx="24"/>
    </clipPath>
  </defs>

  <g clip-path="url(#frame)">
    <rect width="1200" height="360" fill="url(#background)"/>
    <rect width="1200" height="360" fill="url(#grid)"/>
    <ellipse cx="600" cy="175" rx="430" ry="220" fill="url(#halo)"/>

    <g fill="none" stroke="#d4af37" stroke-opacity="0.22">
      <circle cx="88" cy="180" r="108"/>
      <circle cx="88" cy="180" r="76" stroke-dasharray="3 9"/>
      <circle cx="1112" cy="180" r="108"/>
      <circle cx="1112" cy="180" r="76" stroke-dasharray="3 9"/>
    </g>

    <g fill="#d4af37">
      <circle cx="88" cy="72" r="4" filter="url(#glow)" />
      <circle cx="1112" cy="288" r="4" filter="url(#glow)" />
      <circle cx="187" cy="72" r="2" opacity="0.6"/>
      <circle cx="1027" cy="98" r="2" opacity="0.5"/>
      <circle cx="214" cy="288" r="2" opacity="0.45"/>
      <circle cx="989" cy="274" r="2" opacity="0.6"/>
    </g>

    <path d="M0 25 H245 L270 0" fill="none" stroke="url(#gold)" stroke-width="2" opacity="0.8"/>
    <path d="M1200 335 H955 L930 360" fill="none" stroke="url(#gold)" stroke-width="2" opacity="0.8"/>

    <g font-family="Segoe UI, Inter, Arial, sans-serif" text-anchor="middle">
      <text x="600" y="101" fill="#8b949e" font-size="14" font-weight="600" letter-spacing="7">INGENIERÍA DE SOFTWARE</text>
      <text x="600" y="181" fill="url(#gold)" font-size="62" font-weight="800" letter-spacing="4" filter="url(#glow)">ALEJANDRO OJEDA</text>
      <rect x="382" y="207" width="436" height="1.5" rx="1" fill="url(#gold)" opacity="0.9"/>
      <text x="600" y="249" fill="#e6edf3" font-size="18" font-weight="500" letter-spacing="3">FULL-STACK  ·  EXPERIENCIAS INTERACTIVAS  ·  SISTEMAS</text>
      <text x="600" y="295" fill="#d4af37" font-size="13" font-weight="600" letter-spacing="4">QUITO  ·  ECUADOR  ·  UTC−5</text>
    </g>

    <g font-family="Consolas, monospace" font-size="24" fill="#d4af37" opacity="0.55">
      <text x="72" y="189">&lt;/&gt;</text>
      <text x="1080" y="189">{ }</text>
    </g>
  </g>
  <rect x="1" y="1" width="1198" height="358" rx="23" fill="none" stroke="#d4af37" stroke-opacity="0.35" stroke-width="2"/>
</svg>

